<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a1a44" />
  <title>CDA Graphic — Op Art Pattern Generator</title>
  <style>
    :root {
      --bg: #0a1a44;
      --ink: #1f3668;
      --panelText: #121826;
      --muted: #687083;
      --border: rgba(18,24,38,.12);
      --shadow: 0 20px 60px rgba(0,0,0,.18);
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #ececf0;
      color: var(--panelText);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(290px, 370px) 1fr;
    }

    .panel {
      position: relative;
      z-index: 2;
      padding: 24px;
      overflow: auto;
      background: #f7f7f8;
      border-right: 1px solid #dddde2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--bg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
    }

    .brand-mark::before {
      content: "";
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 5px dashed var(--ink);
      transform: rotate(18deg);
    }

    h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.1;
      letter-spacing: -.02em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .section {
      padding: 18px 0;
    }

    .section:first-of-type {
      padding-top: 0;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .11em;
      color: #555e70;
    }

    .control {
      display: grid;
      gap: 8px;
      margin: 0 0 16px;
    }

    .control:last-child { margin-bottom: 0; }

    .control-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      font-weight: 650;
    }

    .value {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      appearance: none;
      border-radius: 999px;
      background: #d9dbe2;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #111827;
      border: 3px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }

    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #111827;
      border: 3px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 5px;
      background: #e9eaf0;
      border-radius: 13px;
    }

    .segmented button {
      border: 0;
      padding: 9px 6px;
      border-radius: 9px;
      background: transparent;
      color: #5d6576;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: .18s ease;
    }

    .segmented button:hover { color: #202638; }

    .segmented button[aria-pressed="true"] {
      background: #fff;
      color: #121826;
      box-shadow: 0 1px 5px rgba(18,24,38,.12);
    }


    .animation-row {
      display: grid;
      grid-template-columns: 1fr 44px;
      gap: 8px;
      align-items: stretch;
    }

    .speed-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 5px;
      background: #e9eaf0;
      border-radius: 13px;
    }

    .speed-buttons button {
      min-width: 0;
      min-height: 34px;
      border: 0;
      padding: 7px 4px;
      border-radius: 9px;
      background: transparent;
      color: #5d6576;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: .18s ease;
    }

    .speed-buttons button:hover {
      color: #202638;
    }

    .speed-buttons button[aria-pressed="true"] {
      background: #fff;
      color: #121826;
      box-shadow: 0 1px 5px rgba(18,24,38,.12);
    }

    .icon-button {
      width: 44px;
      min-height: 44px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid #d4d6dd;
      border-radius: 12px;
      background: #111827;
      color: #fff;
      cursor: pointer;
      transition: .18s ease;
    }

    .icon-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(0,0,0,.10);
    }

    .icon-button svg {
      width: 18px;
      height: 18px;
      display: block;
      fill: currentColor;
    }

    .icon-button .stop-icon {
      display: none;
    }

    .icon-button[aria-pressed="true"] .play-icon {
      display: none;
    }

    .icon-button[aria-pressed="true"] .stop-icon {
      display: block;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .palette {
      display: flex;
      min-height: 44px;
      padding: 0;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      transition: .18s ease;
    }

    .palette:hover { transform: translateY(-1px); }

    .palette[aria-pressed="true"] {
      border-color: #111827;
      box-shadow: 0 0 0 2px #fff inset;
    }

    .swatch {
      flex: 1;
      min-width: 0;
    }

    .swap-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      margin-top: 3px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 6px;
    }

    .btn {
      border: 1px solid #d4d6dd;
      border-radius: 12px;
      background: #fff;
      color: #171c29;
      min-height: 42px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: .18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(0,0,0,.08);
    }

    .btn.primary {
      background: #111827;
      border-color: #111827;
      color: #fff;
    }

    .btn.wide {
      grid-column: 1 / -1;
    }

    .stage {
      position: sticky;
      top: 0;
      align-self: start;
      min-width: 0;
      height: 100vh;
      display: grid;
      place-items: start center;
      padding: 24px 0;
      overflow: hidden;
      background: #d8d8dc;
    }

    .canvas-wrap {
      position: relative;
      width: min(92%, 1180px, calc((100vh - 48px) * 4 / 3));
      aspect-ratio: 4 / 3;
      max-height: calc(100vh - 48px);
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--bg);
      box-shadow: var(--shadow);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--bg);
    }

    .badge {
      position: absolute;
      right: 16px;
      bottom: 16px;
      padding: 7px 9px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: rgba(0,0,0,.18);
      color: rgba(255,255,255,.78);
      backdrop-filter: blur(8px);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      pointer-events: none;
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(56vh, 1fr);
      }

      .panel {
        border-right: 0;
        border-bottom: 1px solid #dddde2;
      }

      .stage {
        position: relative;
        top: auto;
        height: auto;
        min-height: 62vh;
        padding: 20px 0;
      }

      .canvas-wrap {
        width: 92%;
        max-height: none;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <aside class="panel">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>CDA Graphic</h1>
          <p class="subtitle">Op-art line displacement generator</p>
        </div>
      </div>

      <section class="section">
        <p class="section-title">Pattern</p>

        <div class="control">
          <div class="control-head">
            <label for="density">Density / line gap</label>
            <output class="value" id="densityValue">14 px</output>
          </div>
          <input id="density" type="range" min="4" max="48" value="14" step="1" />
        </div>

        <div class="control">
          <div class="control-head">
            <label for="layers">Pattern groups / layers</label>
            <output class="value" id="layersValue">1</output>
          </div>
          <input id="layers" type="range" min="1" max="6" value="1" step="1" />
        </div>

        <div class="control">
          <div class="control-head">
            <label for="displacement">Stroke displacement</label>
            <output class="value" id="displacementValue">0%</output>
          </div>
          <input id="displacement" type="range" min="0" max="100" value="0" step="1" />
        </div>
      </section>

      <section class="section">
        <p class="section-title">Stroke thickness</p>

        <div class="control">
          <div class="control-head">
            <label for="thickThickness">Thick stroke</label>
            <output class="value" id="thickThicknessValue">14 px</output>
          </div>
          <input id="thickThickness" type="range" min="2" max="40" value="14" step="1" />
        </div>

        <div class="control">
          <div class="control-head">
            <label for="thinThickness">Thin stroke</label>
            <output class="value" id="thinThicknessValue">3 px</output>
          </div>
          <input id="thinThickness" type="range" min="1" max="24" value="3" step="1" />
        </div>

        <div class="swap-row">
          <button class="btn" id="swapBtn" type="button">Swap thin ↔ thick positions</button>
        </div>
      </section>

      <section class="section">
        <p class="section-title">Animation</p>

        <div class="animation-row">
          <div class="speed-buttons" id="speedButtons" role="group" aria-label="Animation speed">
            <button type="button" data-speed="0.5" aria-pressed="true">0.5×</button>
            <button type="button" data-speed="1" aria-pressed="false">1×</button>
            <button type="button" data-speed="2" aria-pressed="false">2×</button>
            <button type="button" data-speed="3" aria-pressed="false">3×</button>
          </div>

          <button
            class="icon-button"
            id="animateBtn"
            type="button"
            aria-pressed="false"
            aria-label="Play animation"
            title="Play animation"
          >
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5.5v13l10-6.5z"></path>
            </svg>
            <svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6.5" y="6.5" width="11" height="11" rx="1"></rect>
            </svg>
          </button>
        </div>
      </section>

      <section class="section">
        <p class="section-title">Direction</p>
        <div class="segmented" id="orientation" role="group" aria-label="Pattern direction">
          <button type="button" data-mode="horizontal" aria-pressed="true">Horizontal</button>
          <button type="button" data-mode="vertical" aria-pressed="false">Vertical</button>
          <button type="button" data-mode="radial" aria-pressed="false">Radial</button>
        </div>
      </section>

      <section class="section">
        <p class="section-title">Colour pair</p>
        <div class="palette-grid" id="palettes">
          <button class="palette" type="button"
            data-bg="#0a1a44" data-ink="#1f3668"
            title="Background #0a1a44 · Pattern #1f3668"
            aria-label="Navy pair: background #0a1a44, pattern #1f3668"
            aria-pressed="true">
            <span class="swatch" style="background:#0a1a44"></span>
            <span class="swatch" style="background:#1f3668"></span>
          </button>

          <button class="palette" type="button"
            data-bg="#491123" data-ink="#561e35"
            title="Background #491123 · Pattern #561e35"
            aria-label="Burgundy pair: background #491123, pattern #561e35"
            aria-pressed="false">
            <span class="swatch" style="background:#491123"></span>
            <span class="swatch" style="background:#561e35"></span>
          </button>

          <button class="palette" type="button"
            data-bg="#1a3b40" data-ink="#204d51"
            title="Background #1a3b40 · Pattern #204d51"
            aria-label="Green pair: background #1a3b40, pattern #204d51"
            aria-pressed="false">
            <span class="swatch" style="background:#1a3b40"></span>
            <span class="swatch" style="background:#204d51"></span>
          </button>

          <button class="palette" type="button"
            data-bg="#2c183d" data-ink="#3a2254"
            title="Background #2c183d · Pattern #3a2254"
            aria-label="Purple pair: background #2c183d, pattern #3a2254"
            aria-pressed="false">
            <span class="swatch" style="background:#2c183d"></span>
            <span class="swatch" style="background:#3a2254"></span>
          </button>

          <button class="palette" type="button"
            data-bg="#2456d8" data-ink="#ffffff"
            title="Background #2456d8 · Pattern #ffffff"
            aria-label="Bright blue pair: background #2456d8, pattern #ffffff"
            aria-pressed="false">
            <span class="swatch" style="background:#2456d8"></span>
            <span class="swatch" style="background:#ffffff"></span>
          </button>

          <button class="palette" type="button"
            data-bg="#e75f34" data-ink="#f5efe8"
            title="Background #e75f34 · Pattern #f5efe8"
            aria-label="Orange pair: background #e75f34, pattern #f5efe8"
            aria-pressed="false">
            <span class="swatch" style="background:#e75f34"></span>
            <span class="swatch" style="background:#f5efe8"></span>
          </button>

          <button class="palette" type="button"
            data-bg="#bfeb6e" data-ink="#1a3b40"
            title="Background #bfeb6e · Pattern #1a3b40"
            aria-label="Lime pair: background #bfeb6e, pattern #1a3b40"
            aria-pressed="false">
            <span class="swatch" style="background:#bfeb6e"></span>
            <span class="swatch" style="background:#1a3b40"></span>
          </button>

          <button class="palette" type="button"
            data-bg="#c8b9e8" data-ink="#2c183d"
            title="Background #c8b9e8 · Pattern #2c183d"
            aria-label="Lavender pair: background #c8b9e8, pattern #2c183d"
            aria-pressed="false">
            <span class="swatch" style="background:#c8b9e8"></span>
            <span class="swatch" style="background:#2c183d"></span>
          </button>
        </div>
      </section>

      <section class="section">
        <p class="section-title">Output</p>
        <div class="actions">
          <button class="btn wide" id="resetBtn" type="button">Reset</button>
          <button class="btn primary" id="downloadPngBtn" type="button">Download PNG</button>
          <button class="btn primary" id="downloadSvgBtn" type="button">Download SVG</button>
        </div>
      </section>
    </aside>

    <section class="stage">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="art" aria-label="Generated op-art pattern"></canvas>
        <div class="badge" id="modeBadge">Horizontal · 1 group</div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('art');
      const wrap = document.getElementById('canvasWrap');
      const ctx = canvas.getContext('2d');

      const controls = {
        density: document.getElementById('density'),
        layers: document.getElementById('layers'),
        displacement: document.getElementById('displacement'),
        thickThickness: document.getElementById('thickThickness'),
        thinThickness: document.getElementById('thinThickness')
      };

      const outputs = {
        density: document.getElementById('densityValue'),
        layers: document.getElementById('layersValue'),
        displacement: document.getElementById('displacementValue'),
        thickThickness: document.getElementById('thickThicknessValue'),
        thinThickness: document.getElementById('thinThicknessValue')
      };

      const badge = document.getElementById('modeBadge');
      const animateBtn = document.getElementById('animateBtn');
      const speedButtons = document.getElementById('speedButtons');
      const TAU = Math.PI * 2;

      const defaults = {
        density: 14,
        layers: 1,
        displacement: 0,
        thickThickness: 14,
        thinThickness: 3,
        orientation: 'horizontal',
        bg: '#0a1a44',
        ink: '#1f3668',
        swapped: false,
        animationSpeed: 0.50,
        animating: false
      };

      const state = { ...defaults };

      let logicalWidth = 1;
      let logicalHeight = 1;
      let dpr = 1;
      let animationFrameId = null;
      let animationPhase = 0;
      let lastAnimationTime = null;

      function fmt(n) {
        return Number(n.toFixed(3));
      }

      function rectangleCorners(x1, y1, x2, y2, width) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const length = Math.hypot(dx, dy) || 1;

        // Perpendicular unit vector.
        const px = -dy / length;
        const py = dx / length;
        const half = width / 2;

        return [
          [x1 + px * half, y1 + py * half],
          [x2 + px * half, y2 + py * half],
          [x2 - px * half, y2 - py * half],
          [x1 - px * half, y1 - py * half]
        ];
      }

      function makeCanvasRenderer() {
        return {
          rect(x1, y1, x2, y2, width) {
            const points = rectangleCorners(x1, y1, x2, y2, width);

            ctx.fillStyle = state.ink;
            ctx.beginPath();
            ctx.moveTo(points[0][0], points[0][1]);
            ctx.lineTo(points[1][0], points[1][1]);
            ctx.lineTo(points[2][0], points[2][1]);
            ctx.lineTo(points[3][0], points[3][1]);
            ctx.closePath();
            ctx.fill();
          }
        };
      }

      function makeSvgRenderer(parts) {
        return {
          rect(x1, y1, x2, y2, width) {
            const points = rectangleCorners(x1, y1, x2, y2, width)
              .map(([x, y]) => `${fmt(x)},${fmt(y)}`)
              .join(' ');

            parts.push(
              `<polygon points="${points}" fill="${state.ink}" />`
            );
          }
        };
      }

      function resizeCanvas() {
        const rect = wrap.getBoundingClientRect();
        logicalWidth = Math.max(1, rect.width);
        logicalHeight = Math.max(1, rect.height);
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(logicalWidth * dpr);
        canvas.height = Math.round(logicalHeight * dpr);
        render();
      }

      function updateUI() {
        outputs.density.textContent = `${state.density} px`;
        outputs.layers.textContent = state.layers;
        outputs.displacement.textContent = `${state.displacement}%`;
        outputs.thickThickness.textContent = `${state.thickThickness} px`;
        outputs.thinThickness.textContent = `${state.thinThickness} px`;

        controls.thickThickness.min = Math.max(2, state.thinThickness + 1);
        controls.thinThickness.max = Math.max(1, state.thickThickness - 1);

        const modeLabel = state.orientation[0].toUpperCase() + state.orientation.slice(1);
        badge.textContent = `${modeLabel} · ${state.layers} group${state.layers === 1 ? '' : 's'}`;

        animateBtn.setAttribute(
          'aria-pressed',
          state.animating ? 'true' : 'false'
        );
        animateBtn.setAttribute(
          'aria-label',
          state.animating ? 'Stop animation' : 'Play animation'
        );
        animateBtn.setAttribute(
          'title',
          state.animating ? 'Stop animation' : 'Play animation'
        );

        speedButtons.querySelectorAll('button[data-speed]').forEach((button) => {
          button.setAttribute(
            'aria-pressed',
            Number(button.dataset.speed) === state.animationSpeed
              ? 'true'
              : 'false'
          );
        });

        document.documentElement.style.setProperty('--bg', state.bg);
        document.documentElement.style.setProperty('--ink', state.ink);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', state.bg);
      }

      /*
        Equal-half + displacement logic:

        Each group is divided exactly 50/50.
        First half and second half are always the same length.

        Horizontal:
          first half = up
          second half = down

        Vertical:
          first half = left
          second half = right

        Radial:
          first half = counter-clockwise
          second half = clockwise

        The Swap button changes which stroke thickness occupies the first/second half.
        It does not change the displacement directions themselves.

        Animation advances continuously in one direction:
          horizontal = first half up / second half down
          vertical = first half left / second half right
          radial = first half counter-clockwise / second half clockwise
      */

      function firstWidth() {
        return state.swapped ? state.thickThickness : state.thinThickness;
      }

      function secondWidth() {
        return state.swapped ? state.thinThickness : state.thickThickness;
      }

      function wrapPeriodic(value, period) {
        if (period <= 0) return 0;

        return (
          ((value + period / 2) % period + period) % period
        ) - period / 2;
      }

      function lineStep() {
        const maxWidth = Math.max(
          state.thickThickness,
          state.thinThickness
        );

        // Density is the actual empty gap between repeated strokes
        // of the same half-pattern.
        return maxWidth + state.density;
      }

      function staticLinearShift(step) {
        // 0% = centred.
        // 100% = close to half a repeat interval, without aliasing
        // into the neighbouring repeated line.
        return step * 0.45 * (state.displacement / 100);
      }

      function linearCrossPositions(crossSize) {
        const step = lineStep();

        // Draw additional repeated lines outside the visible area.
        // Because animation wraps by exactly one 'step', these extras make
        // the motion visually seamless at the canvas edges.
        const first = -2 * step;
        const count = Math.ceil(crossSize / step) + 5;

        return {
          step,
          positions: Array.from(
            { length: count },
            (_, i) => first + i * step
          )
        };
      }

      function groupSegments(totalLength) {
        const margin = Math.max(34, totalLength * 0.075);
        const available = Math.max(1, totalLength - 2 * margin);

        // NO GAP between pattern groups.
        const groupLength = available / state.layers;

        return Array.from({ length: state.layers }, (_, index) => {
          const start = margin + index * groupLength;
          const middle = start + groupLength / 2;
          const end = start + groupLength;
          return { start, middle, end };
        });
      }

      function drawHorizontal(renderer, w, h) {
        const { step, positions } = linearCrossPositions(h);
        const groups = groupSegments(w);
        const widthA = firstWidth();
        const widthB = secondWidth();

        const baseShift = staticLinearShift(step);
        const travel = animationPhase * step;

        // First half always travels UP.
        const firstOffset = wrapPeriodic(
          -baseShift - travel,
          step
        );

        // Second half always travels DOWN.
        const secondOffset = wrapPeriodic(
          baseShift + travel,
          step
        );

        for (const y of positions) {
          for (const group of groups) {
            renderer.rect(
              group.start, y + firstOffset,
              group.middle, y + firstOffset,
              widthA
            );

            renderer.rect(
              group.middle, y + secondOffset,
              group.end, y + secondOffset,
              widthB
            );
          }
        }
      }

      function drawVertical(renderer, w, h) {
        const { step, positions } = linearCrossPositions(w);
        const groups = groupSegments(h);
        const widthA = firstWidth();
        const widthB = secondWidth();

        const baseShift = staticLinearShift(step);
        const travel = animationPhase * step;

        // First half always travels LEFT.
        const firstOffset = wrapPeriodic(
          -baseShift - travel,
          step
        );

        // Second half always travels RIGHT.
        const secondOffset = wrapPeriodic(
          baseShift + travel,
          step
        );

        for (const x of positions) {
          for (const group of groups) {
            renderer.rect(
              x + firstOffset, group.start,
              x + firstOffset, group.middle,
              widthA
            );

            renderer.rect(
              x + secondOffset, group.middle,
              x + secondOffset, group.end,
              widthB
            );
          }
        }
      }

      function polarPoint(cx, cy, radius, angle) {
        return [
          cx + Math.cos(angle) * radius,
          cy + Math.sin(angle) * radius
        ];
      }

      function drawRadial(renderer, w, h) {
        const cx = w / 2;
        const cy = h / 2;
        const minDim = Math.min(w, h);

        const innerRadius = minDim * 0.15;
        const outerRadius = minDim * 0.44;

        // No gap between radial groups.
        const totalRadialSpan =
          Math.max(20, outerRadius - innerRadius);
        const groupSpan =
          totalRadialSpan / state.layers;

        const firstMiddleRadius =
          innerRadius + groupSpan / 2;

        const maxWidth = Math.max(
          state.thickThickness,
          state.thinThickness
        );

        // Determine spoke density at the smallest relevant radius.
        // Every spoke itself is a true rectangle with constant width.
        const requiredArc =
          maxWidth + state.density;

        const circumference =
          TAU * Math.max(firstMiddleRadius, 1);

        const spokeCount = Math.max(
          6,
          Math.min(
            180,
            Math.floor(circumference / requiredArc)
          )
        );

        const angleStep = TAU / spokeCount;
        const widthA = firstWidth();
        const widthB = secondWidth();

        // Stroke displacement becomes the initial angular separation.
        const baseAngleShift =
          angleStep *
          0.45 *
          (state.displacement / 100);

        const travelAngle =
          animationPhase * angleStep;

        // First half always moves counter-clockwise.
        const firstAngleOffset = wrapPeriodic(
          -baseAngleShift - travelAngle,
          angleStep
        );

        // Second half always moves clockwise.
        const secondAngleOffset = wrapPeriodic(
          baseAngleShift + travelAngle,
          angleStep
        );

        for (
          let groupIndex = 0;
          groupIndex < state.layers;
          groupIndex++
        ) {
          const groupInner =
            innerRadius + groupIndex * groupSpan;
          const groupMiddle =
            groupInner + groupSpan / 2;
          const groupOuter =
            groupInner + groupSpan;

          for (let i = 0; i < spokeCount; i++) {
            const baseAngle =
              -Math.PI / 2 + i * angleStep;

            const firstAngle =
              baseAngle + firstAngleOffset;

            const firstStart =
              polarPoint(
                cx,
                cy,
                groupInner,
                firstAngle
              );

            const firstEnd =
              polarPoint(
                cx,
                cy,
                groupMiddle,
                firstAngle
              );

            renderer.rect(
              firstStart[0],
              firstStart[1],
              firstEnd[0],
              firstEnd[1],
              widthA
            );

            const secondAngle =
              baseAngle + secondAngleOffset;

            const secondStart =
              polarPoint(
                cx,
                cy,
                groupMiddle,
                secondAngle
              );

            const secondEnd =
              polarPoint(
                cx,
                cy,
                groupOuter,
                secondAngle
              );

            renderer.rect(
              secondStart[0],
              secondStart[1],
              secondEnd[0],
              secondEnd[1],
              widthB
            );
          }
        }
      }

      function drawPattern(renderer, w, h) {
        if (state.orientation === 'horizontal') {
          drawHorizontal(renderer, w, h);
        } else if (state.orientation === 'vertical') {
          drawVertical(renderer, w, h);
        } else {
          drawRadial(renderer, w, h);
        }
      }

      function render() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = state.bg;
        ctx.fillRect(0, 0, logicalWidth, logicalHeight);

        drawPattern(makeCanvasRenderer(), logicalWidth, logicalHeight);
      }

      function stopAnimation({ keepCurrentFrame = true } = {}) {
        if (animationFrameId !== null) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }

        state.animating = false;
        lastAnimationTime = null;

        if (!keepCurrentFrame) {
          animationPhase = 0;
          render();
        }

        updateUI();
      }

      function animationLoop(now) {
        if (!state.animating) return;

        if (lastAnimationTime === null) {
          lastAnimationTime = now;
        }

        const deltaSeconds =
          Math.min(
            0.05,
            Math.max(
              0,
              (now - lastAnimationTime) / 1000
            )
          );

        lastAnimationTime = now;

        // IMPORTANT:
        // animationPhase ONLY INCREASES.
        // There is no sine/cosine, so the motion never reverses.
        //
        // The repeated line lattice wraps seamlessly:
        // horizontal first/second halves = up/down forever
        // vertical first/second halves   = left/right forever
        // radial first/second halves     = CCW/CW forever
        const cyclesPerSecond =
          state.animationSpeed * 0.28;

        animationPhase =
          (animationPhase +
            deltaSeconds * cyclesPerSecond) % 1;

        render();

        animationFrameId =
          requestAnimationFrame(animationLoop);
      }

      function startAnimation() {
        if (state.animating) return;

        state.animating = true;
        lastAnimationTime = null;

        updateUI();

        animationFrameId =
          requestAnimationFrame(animationLoop);
      }

      function toggleAnimation() {
        if (state.animating) {
          // Stop = return to the pattern's starting phase.
          stopAnimation({
            keepCurrentFrame: false
          });
        } else {
          startAnimation();
        }
      }

      function createSvg() {
        const w = logicalWidth;
        const h = logicalHeight;
        const parts = [];

        parts.push(
          `<svg xmlns="http://www.w3.org/2000/svg" ` +
          `width="${fmt(w)}" height="${fmt(h)}" ` +
          `viewBox="0 0 ${fmt(w)} ${fmt(h)}" ` +
          `shape-rendering="geometricPrecision">`
        );

        parts.push(
          `<rect width="${fmt(w)}" height="${fmt(h)}" fill="${state.bg}" />`
        );

        drawPattern(makeSvgRenderer(parts), w, h);

        parts.push(`</svg>`);
        return parts.join('\n');
      }

      function downloadBlob(filename, blob) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      controls.density.addEventListener('input', (event) => {
        state.density = Number(event.target.value);
        updateUI();
        render();
      });

      controls.layers.addEventListener('input', (event) => {
        state.layers = Number(event.target.value);
        updateUI();
        render();
      });

      controls.displacement.addEventListener('input', (event) => {
        state.displacement = Number(event.target.value);
        updateUI();
        render();
      });

      controls.thickThickness.addEventListener('input', (event) => {
        state.thickThickness = Math.max(
          Number(event.target.value),
          state.thinThickness + 1
        );

        event.target.value = state.thickThickness;
        updateUI();
        render();
      });

      controls.thinThickness.addEventListener('input', (event) => {
        state.thinThickness = Math.min(
          Number(event.target.value),
          state.thickThickness - 1
        );

        event.target.value = state.thinThickness;
        updateUI();
        render();
      });

      speedButtons.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-speed]');
        if (!button) return;

        state.animationSpeed = Number(button.dataset.speed);
        updateUI();
      });

      animateBtn.addEventListener('click', toggleAnimation);

      document.getElementById('swapBtn').addEventListener('click', () => {
        state.swapped = !state.swapped;
        updateUI();
        render();
      });

      document.getElementById('orientation').addEventListener('click', (event) => {
        const button = event.target.closest('button[data-mode]');
        if (!button) return;

        state.orientation = button.dataset.mode;

        document.querySelectorAll('#orientation button').forEach((item) => {
          item.setAttribute(
            'aria-pressed',
            item === button ? 'true' : 'false'
          );
        });

        updateUI();
        render();
      });

      document.getElementById('palettes').addEventListener('click', (event) => {
        const button = event.target.closest('.palette');
        if (!button) return;

        state.bg = button.dataset.bg;
        state.ink = button.dataset.ink;

        document.querySelectorAll('.palette').forEach((item) => {
          item.setAttribute(
            'aria-pressed',
            item === button ? 'true' : 'false'
          );
        });

        updateUI();
        render();
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        if (animationFrameId !== null) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }

        Object.assign(state, defaults);
        animationPhase = 0;
        lastAnimationTime = null;

        for (const [key, control] of Object.entries(controls)) {
          control.value = state[key];
        }

        document.querySelectorAll('#orientation button').forEach((item) => {
          item.setAttribute(
            'aria-pressed',
            item.dataset.mode === state.orientation ? 'true' : 'false'
          );
        });

        document.querySelectorAll('.palette').forEach((item) => {
          item.setAttribute(
            'aria-pressed',
            item.dataset.bg === state.bg &&
            item.dataset.ink === state.ink
              ? 'true'
              : 'false'
          );
        });

        updateUI();
        render();
      });

      document.getElementById('downloadPngBtn').addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = `cda-graphic-${state.orientation}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });

      document.getElementById('downloadSvgBtn').addEventListener('click', () => {
        const svg = createSvg();
        const blob = new Blob([svg], {
          type: 'image/svg+xml;charset=utf-8'
        });

        downloadBlob(
          `cda-graphic-${state.orientation}.svg`,
          blob
        );
      });

      const resizeObserver = new ResizeObserver(resizeCanvas);
      resizeObserver.observe(wrap);

      updateUI();
      resizeCanvas();
    })();
  </script>
</body>
</html>
